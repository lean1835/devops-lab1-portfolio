# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động deploy website lên GitHub Pages mỗi khi push code
# Tích hợp Lighthouse CI tự động kiểm tra Performance & SEO
# ============================================================

name: 🚀 Deploy to GitHub Pages & Lighthouse CI

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main]       # Chạy khi push lên nhánh main
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

# Permissions required to deploy to GitHub Pages
permissions:
  contents: write

# === Các job trong pipeline ===
jobs:
  # Job 1: Build, Audit & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest   # Chạy trên máy ảo Ubuntu (free)

    steps:
      # Step 1: Checkout code từ GitHub
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra HTML cơ bản
      - name: 🧪 Validate HTML
        run: |
          echo "Checking HTML files exist..."
          for file in index.html about.html contact.html; do
            if [ -f "$file" ]; then
              echo "✅ $file found! ($(wc -c < $file) bytes)"
            else
              echo "❌ $file NOT found!"
              exit 1
            fi
          done

      # Step 3: Audit với Google Lighthouse CI
      - name: 🚦 Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifact: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'

      # Step 4: Deploy lên GitHub Pages
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "🚀 Auto-deploy from CI pipeline with Multi-page & Lighthouse CI"
